version: 1

workspace:
  history_max_messages: 50
  history_char_limit: 12000
  cleanup_retention_days: 30
  attachment_max_mb: 100

harness:
  name: ""
  model: ""
  # Empty inherits the selected model/provider default.
  reasoning_effort: ""
  service_mode: ""
  sandbox: danger-full-access
  # Used only when name is acp. Built-in ACP aliases supply these themselves.
  acp_command: ""
  acp_args: []

channels:
  tui:
    title: Spynel
    theme: spynel
  telegram:
    enabled: false
    name: spynel
    token_env: SPYNEL_TELEGRAM_TOKEN
    mode: polling
    webhook_url: ""
    webhook_listen: 127.0.0.1:8787
    webhook_secret: ""
    allowed_users: []
    poll_timeout_seconds: 30
    group_mode: mention
    welcome_enabled: false
    welcome_message: "Welcome, {name}!"
    notify_messages: false
    attachment_max_age_hours: 0
  whatsapp:
    enabled: false
    mode: self-chat
    database: .spynel/whatsapp.db
    allowed_numbers: []
    allow_groups: false
    poll_interval_seconds: 3

speech:
  enabled: true
  # elevenlabs uses the cloud API and falls back to local parakeet when its API key is missing or blank; parakeet runs locally.
  provider: elevenlabs
  model_dir: ""
  language: en
  num_threads: 2
  max_file_mb: 100
  max_duration_seconds: 1800
  chunk_seconds: 600

startup:
  enabled: false

extensions:
  enabled: true
  directory: .spynel/extensions
  hook_timeout: 30s
